<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicios JS</title>
<link rel="stylesheet" href="StyledeEjercicios.CSS">

</head>

<body>

<h1>Ejercicios de formulario</h1>


<div class="box">
<h2>1. Inversión bancaria</h2>
<input type="text" id="capital" placeholder="Capital">
<button onclick="ej1()">Calcular</button>
<div id="r1" class="result"></div>
</div>


<div class="box">
<h2>2. Sueldo vendedor</h2>
<input type="text" id="sueldo" placeholder="Sueldo base"><br>
<input type="text" id="v1" placeholder="Venta 1">
<input type="text" id="v2" placeholder="Venta 2">
<input type="text" id="v3" placeholder="Venta 3">
<button onclick="ej2()">Calcular</button>
<div id="r2" class="result"></div>
</div>


<div class="box">
<h2>3. Descuento tienda</h2>
<input type="text" id="compra" placeholder="Total compra">
<button onclick="ej3()">Calcular</button>
<div id="r3" class="result"></div>
</div>


<div class="box">
<h2>4. Calificación final</h2>
<input type="text" id="p1" placeholder="Parcial 1">
<input type="text" id="p2" placeholder="Parcial 2">
<input type="text" id="p3" placeholder="Parcial 3"><br>
<input type="text" id="examen" placeholder="Examen final">
<input type="text" id="trabajo" placeholder="Trabajo final">
<button onclick="ej4()">Calcular</button>
<div id="r4" class="result"></div>
</div>

<div class="box">
<h2>5. Porcentaje alumnos</h2>
<input type="text" id="hombres" placeholder="Hombres">
<input type="text" id="mujeres" placeholder="Mujeres">
<button onclick="ej5()">Calcular</button>
<div id="r5" class="result"></div>
</div>


<div class="box">
<h2>6. Calcular edad</h2>
<input type="text" id="fecha" placeholder="AAAA-MM-DD">
<button onclick="ej6()">Calcular</button>
<div id="r6" class="result"></div>
</div>

<script>

const numRegex = /^[0-9]+(\.[0-9]+)?$/;

function ej1() {
    let capital = document.getElementById("capital").value;
    if (!numRegex.test(capital)) return alert("Ingrese número válido");

    capital = parseFloat(capital);
    let ganancia = capital * 0.02;

    document.getElementById("r1").innerText =
        "Ganancia: $" + ganancia.toFixed(2);
}

function ej2() {
    let s = sueldo.value, v1 = v1.value, v2 = v2.value, v3 = v3.value;

    if (![s,v1,v2,v3].every(x => numRegex.test(x)))
        return alert("Datos inválidos");

    s = parseFloat(s);
    let ventas = [v1,v2,v3].map(Number);
    let comision = ventas.reduce((a,b)=>a+b) * 0.10;

    document.getElementById("r2").innerText =
        "Comisión: $" + comision.toFixed(2) +
        " Total: $" + (s + comision).toFixed(2);
}

function ej3() {
    let compra = document.getElementById("compra").value;
    if (!numRegex.test(compra)) return alert("Número inválido");

    compra = parseFloat(compra);
    let total = compra * 0.85;

    document.getElementById("r3").innerText =
        "Total a pagar: $" + total.toFixed(2);
}


function ej4() {
    let p1 = p1.value, p2 = p2.value, p3 = p3.value;
    let ex = examen.value, tr = trabajo.value;

    if (![p1,p2,p3,ex,tr].every(x => numRegex.test(x)))
        return alert("Datos inválidos");

    let prom = (Number(p1)+Number(p2)+Number(p3))/3;
    let final = prom*0.55 + ex*0.30 + tr*0.15;

    document.getElementById("r4").innerText =
        "Calificación final: " + final.toFixed(2);
}


function ej5() {
    let h = hombres.value, m = mujeres.value;

    if (![h,m].every(x => numRegex.test(x)))
        return alert("Datos inválidos");

    h = Number(h); m = Number(m);
    let total = h + m;

    document.getElementById("r5").innerText =
        "Hombres: " + ((h/total)*100).toFixed(2) + "% | Mujeres: " +
        ((m/total)*100).toFixed(2) + "%";
}


function ej6() {
    let fecha = document.getElementById("fecha").value;

    // regex fecha
    const fechaRegex = /^\d{4}-\d{2}-\d{2}$/;
    if (!fechaRegex.test(fecha))
        return alert("Formato AAAA-MM-DD");

    let nacimiento = new Date(fecha);
    let hoy = new Date();

    let edad = hoy.getFullYear() - nacimiento.getFullYear();
    let m = hoy.getMonth() - nacimiento.getMonth();

    if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) {
        edad--;
    }

    document.getElementById("r6").innerText =
        "Edad: " + edad + " años";
}
</script>

</body>
</html>
